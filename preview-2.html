<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CottonSeed Digital Lab Offline</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--green:#059669;--green2:#047857;--soft:#ecfdf5;--amber:#b45309;--amberbg:#fffbeb;--red:#b91c1c;--redbg:#fef2f2;--shadow:0 8px 24px rgba(15,23,42,.06)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .app{max-width:1180px;margin:0 auto;padding:14px}.card,.header{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}
    .header{padding:16px;margin-bottom:12px}.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.brand{display:flex;gap:12px;align-items:flex-start}.logo{width:46px;height:46px;border-radius:17px;background:var(--green);display:grid;place-items:center;color:white;font-size:25px;flex:0 0 auto}
    h1{font-size:24px;margin:0;letter-spacing:-.03em}.subtitle{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.35}.menu{border:1px solid var(--border);background:#fff;border-radius:15px;padding:9px 12px;font-weight:900}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.tab{border:0;border-radius:14px;padding:10px 8px;background:#f1f5f9;color:#475569;font-weight:850}.tab.active{background:var(--green);color:#fff}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.metric{padding:14px;display:flex;gap:12px;align-items:center}.mi{width:40px;height:40px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:20px}.metric p{margin:0}.metric .l{font-size:12px;color:var(--muted)}.metric .v{font-size:21px;font-weight:950}.metric .s{font-size:11px;color:var(--muted)}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}.card{padding:16px;overflow:hidden}.title{font-size:19px;font-weight:950;margin:0}.sub{font-size:13px;color:var(--muted);margin:5px 0 0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
    input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:#fff;font-size:14px;outline:none}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--green)}
    .btn{border:0;border-radius:14px;background:var(--green);color:#fff;padding:10px 13px;font-weight:900;cursor:pointer}.btn.secondary{background:#f1f5f9;color:#334155;border:1px solid var(--border)}.btn.red{background:#dc2626}
    .tablewrap{overflow:auto;border:1px solid var(--border);border-radius:16px}table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px;background:#fff}th{background:#f1f5f9;color:#475569;text-align:left;padding:11px;white-space:nowrap}td{border-top:1px solid #f1f5f9;padding:11px;white-space:nowrap}tr.pick{cursor:pointer}tr.pick:hover,tr.selected{background:var(--soft)}
    .badge{display:inline-flex;border:1px solid;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.success{background:var(--soft);border-color:#a7f3d0;color:var(--green2)}.warning{background:var(--amberbg);border-color:#fde68a;color:var(--amber)}.danger{background:var(--redbg);border-color:#fecaca;color:var(--red)}
    .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}.kv span{color:var(--muted)}.note{background:#f1f5f9;border-radius:16px;padding:13px;margin-top:13px}.note small{color:var(--muted)}.note b{display:block;margin-top:4px}
    .progress{height:11px;background:#e2e8f0;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:var(--green);border-radius:99px}.progress.red span{background:#ef4444}
    .hidden{display:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--border);border-radius:19px;padding:13px;background:#fff}.mini.active{background:var(--soft);border-color:#6ee7b7}.mini h3{margin:5px 0;font-size:15px}.mini p{margin:3px 0;color:var(--muted);font-size:12px}
    .formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scanner{border:1px dashed #94a3b8;border-radius:20px;padding:12px;background:#f8fafc}video{width:100%;border-radius:18px;background:#0f172a;max-height:300px}.qrbox{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0f172a;color:#d1fae5;border-radius:14px;padding:10px;font-size:13px;overflow:auto}
    .install{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75;border-radius:18px;padding:13px;margin-bottom:12px;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
    @media(max-width:900px){.app{padding:10px}h1{font-size:20px}.tabs{grid-template-columns:repeat(2,1fr)}.metrics,.g2,.g3,.cards,.formgrid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.card,.header{border-radius:20px;padding:14px}.metric .v{font-size:19px}table{min-width:720px}}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="top">
      <div class="brand"><div class="logo">🌱</div><div><h1>CottonSeed Digital Lab</h1><p class="subtitle">Oflayn urug‘chilik dasturi: nav kartasi, dala daftari, tuproq monitoringi, QR scanner, brak va prognoz.</p></div></div>
      <button class="menu" onclick="toggleTabs()">☰</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="install">Bu fayl telefonda internet bo‘lmasa ham ochiladi. QR kamera ishlashi brauzer ruxsatiga bog‘liq; ishlamasa, QR/ID ni qo‘lda kiriting.</div>
  <section class="metrics" id="metrics"></section>
  <main>
    <section id="dashboard" class="page"></section>
    <section id="variety" class="page hidden"></section>
    <section id="fieldbook" class="page hidden"></section>
    <section id="soil" class="page hidden"></section>
    <section id="qr" class="page hidden"></section>
    <section id="culling" class="page hidden"></section>
    <section id="forecast" class="page hidden"></section>
    <section id="reports" class="page hidden"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const defaultLots=[
{id:"CS-001",variety:"S-6524",generation:"Superelita",field:"12-maydon",area:4.8,location:"41.3341, 69.2879",origin:"Toshkent DAU kolleksiyasi",breeder:"Seleksiya va urug‘chilik guruhi",maturity:"O‘rtapishar",plantType:"Kompakt, simpodial shoxlanish",fiberLength:34.1,fiberOutput:39.8,germination:94,purity:98.6,moisture:22,n:68,p:38,k:74,ph:7.1,salinity:.46,plantHeight:74,branches:12,bollCount:18,disease:2,offType:6,yieldValue:43.2,notes:"Nav tozaligi yuqori. Keyingi bosqichga o‘tkazishga mos."},
{id:"CS-002",variety:"T-230/18",generation:"Elita",field:"7-maydon",area:3.2,location:"41.3272, 69.3018",origin:"Tajriba liniyasi",breeder:"Urug‘chilik laboratoriyasi",maturity:"Ertapishar",plantType:"O‘rtacha bo‘yli, hosil shoxlari kamroq",fiberLength:32.8,fiberOutput:36.4,germination:88,purity:96.4,moisture:16,n:44,p:24,k:61,ph:7.6,salinity:.73,plantHeight:61,branches:8,bollCount:11,disease:9,offType:22,yieldValue:34.1,notes:"Qayta nazorat va qo‘shimcha oziqlantirish tavsiya etiladi."},
{id:"CS-003",variety:"T-445/18",generation:"1-reproduksiya",field:"3-maydon",area:6.1,location:"41.3409, 69.2760",origin:"Tanlov ko‘chatzori",breeder:"Ilmiy guruh",maturity:"Kechroq pishar",plantType:"Bo‘yi pastroq, ko‘sak soni kam",fiberLength:30.2,fiberOutput:32.7,germination:81,purity:93.8,moisture:12,n:32,p:19,k:55,ph:8,salinity:1.08,plantHeight:52,branches:6,bollCount:8,disease:18,offType:49,yieldValue:27.5,notes:"Brak xavfi yuqori. Laboratoriya va dala qayta tekshiruvi zarur."}
];
const defaultStages=[
{lotId:"CS-001",stage:"Unib chiqish",height:8,boll:0,purity:99.2,health:96,date:"2026-04-12"},
{lotId:"CS-001",stage:"Chin barg",height:19,boll:0,purity:99,health:94,date:"2026-04-28"},
{lotId:"CS-001",stage:"Shonalash",height:43,boll:2,purity:98.8,health:92,date:"2026-05-16"},
{lotId:"CS-001",stage:"Gullash",height:66,boll:8,purity:98.6,health:91,date:"2026-06-08"},
{lotId:"CS-001",stage:"Ko‘sak",height:74,boll:18,purity:98.6,health:90,date:"2026-07-01"},
{lotId:"CS-001",stage:"Pishish",height:78,boll:21,purity:98.4,health:89,date:"2026-08-12"}
];
const tabs=[["dashboard","Dashboard"],["variety","Nav kartasi"],["fieldbook","Dala daftari"],["soil","Tuproq"],["qr","QR scanner"],["culling","Brak"],["forecast","Prognoz"],["reports","Hisobot"]];
const layers={moisture:["Namlik","%",35],n:["Azot","mg/kg",80],p:["Fosfor","mg/kg",50],k:["Kaliy","mg/kg",90],ph:["pH","",9],salinity:["Sho‘rlanish","dS/m",1.5]};
let lots=JSON.parse(localStorage.getItem("csdl_lots")||"null")||defaultLots;
let stages=JSON.parse(localStorage.getItem("csdl_stages")||"null")||defaultStages;
let activeTab="dashboard",activeLotId=lots[0]?.id||"",activeLayer="moisture",stream=null,scanTimer=null;
function save(){localStorage.setItem("csdl_lots",JSON.stringify(lots));localStorage.setItem("csdl_stages",JSON.stringify(stages))}
function clamp(v,min=0,max=100){v=Number(v);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):min}
function lot(){return lots.find(x=>x.id===activeLotId)||lots[0]||null}
function risk(l){let r=0;if(!l)return 0;if(l.germination<85)r+=25;if(l.purity<95)r+=30;if(l.moisture<14||l.moisture>28)r+=15;if(l.n<40)r+=10;if(l.p<22)r+=8;if(l.k<55)r+=5;if(l.salinity>.9)r+=12;if(l.disease>12)r+=18;if(l.offType>30)r+=25;return clamp(r)}
function morph(l){return Math.round(clamp(clamp(l.plantHeight/80*100)*.3+clamp(l.branches/14*100)*.25+clamp(l.bollCount/22*100)*.45))}
function forecast(l){if(!l)return 0;let ns=clamp(((l.n/80*100)+(l.p/50*100)+(l.k/90*100))/3),hs=clamp(100-l.disease*2);return Math.round(clamp(l.germination*.18+l.purity*.22+ns*.18+hs*.17+morph(l)*.25))}
function dec(l){let r=risk(l),f=forecast(l);if(r>=70||f<55)return{label:"Brakka chiqarish",tone:"danger",note:"Urug‘lik sifatida qoldirish tavsiya etilmaydi."};if(r>=40||f<70)return{label:"Qayta nazorat",tone:"warning",note:"Laboratoriya va dala qayta tekshiruvi kerak."};return{label:"Urug‘likka qoldirish",tone:"success",note:"Keyingi urug‘chilik bosqichiga o‘tkazish mumkin."}}
function badge(d){return `<span class="badge ${d.tone}">${d.label}</span>`}
function prog(v,c=""){return `<div class="progress ${c}"><span style="width:${clamp(v)}%"></span></div>`}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function setTab(t){stopScanner();activeTab=t;document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));document.getElementById(t).classList.remove("hidden");document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function toggleTabs(){document.getElementById("tabs").classList.toggle("hidden")}
function renderTabs(){document.getElementById("tabs").innerHTML=tabs.map(([id,label])=>`<button class="tab ${id===activeTab?"active":""}" data-tab="${id}" onclick="setTab('${id}')">${label}</button>`).join("")}
function renderMetrics(){let area=lots.reduce((s,l)=>s+Number(l.area||0),0).toFixed(1),avg=lots.length?Math.round(lots.reduce((s,l)=>s+forecast(l),0)/lots.length):0,hi=lots.filter(l=>risk(l)>=70||forecast(l)<55).length;document.getElementById("metrics").innerHTML=[["🗄️","Partiyalar",lots.length,"Lokal bazada"],["📍","Maydonlar",area+" ga","GPS bilan"],["✅","Prognoz",avg+"%","O‘rtacha indeks"],["⚠️","Brak xavfi",hi+" ta","Yuqori xavf"]].map(x=>`<div class="card metric"><div class="mi">${x[0]}</div><div><p class="l">${x[1]}</p><p class="v">${x[2]}</p><p class="s">${x[3]}</p></div></div>`).join("")}
function renderDashboard(){let l=lot();document.getElementById("dashboard").innerHTML=`<div class="grid g3"><div class="card"><div class="toolbar"><div><h2 class="title">Urug‘lik partiyalari</h2><p class="sub">ID, nav, maydon va sifat holati</p></div><input id="q" oninput="rows()" placeholder="Qidirish: nav, ID, maydon"></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Nav</th><th>Avlod</th><th>Maydon</th><th>Unuvchanlik</th><th>Tozalik</th><th>Holat</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card">${lotCard(l)}</div></div>`;rows()}
function lotCard(l){let d=dec(l);return `<h2 class="title">Tanlangan partiya</h2><p class="sub">${l.id} · ${l.variety} · ${l.field}</p><div style="margin-top:12px">${["generation:Avlod","origin:Kelib chiqishi","breeder:Mas’ul","location:GPS","yieldValue:Hosildorlik","fiberOutput:Tola chiqimi"].map(x=>{let [k,n]=x.split(":");let val=l[k];if(k==="yieldValue")val+=" s/ga";if(k==="fiberOutput")val+="%";return `<div class="kv"><span>${n}</span><b>${val}</b></div>`}).join("")}</div><div class="note"><small>AI xulosa</small><div style="margin-top:7px">${badge(d)}</div><b>${d.note}</b></div>`}
function rows(){let q=(document.getElementById("q")?.value||"").toLowerCase(),arr=lots.filter(l=>`${l.id} ${l.variety} ${l.field} ${l.generation}`.toLowerCase().includes(q));document.getElementById("rows").innerHTML=arr.map(l=>`<tr class="pick ${l.id===activeLotId?"selected":""}" onclick="activeLotId='${l.id}';renderAll()"><td><b>${l.id}</b></td><td>${l.variety}</td><td>${l.generation}</td><td>${l.field}</td><td>${l.germination}%</td><td>${l.purity}%</td><td>${badge(dec(l))}</td></tr>`).join("")||`<tr><td colspan="7" style="text-align:center;color:#64748b;padding:20px">Topilmadi</td></tr>`}
function renderVariety(){let l=lot();document.getElementById("variety").innerHTML=`<div class="grid g2"><div class="card">${lotCard(l)}<div class="note"><small>Nav tavsifi</small><b>${l.notes||""}</b></div></div><div class="card"><h2 class="title">Navga tegishli ma’lumotlar</h2><div style="margin-top:12px">${[["Nav nomi",l.variety],["Avlod bosqichi",l.generation],["Pishish turi",l.maturity],["O‘simlik tipi",l.plantType],["Tola uzunligi",l.fiberLength+" mm"],["Tola chiqimi",l.fiberOutput+"%"],["Unuvchanlik",l.germination+"%"],["Nav tozaligi",l.purity+"%"],["Ko‘sak soni",l.bollCount+" dona"],["Kasallik belgisi",l.disease+"%"],["Navga xos bo‘lmagan",l.offType+" ta"]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="setTab('qr')">QR orqali ochish</button><button class="btn secondary" onclick="exportData()">Bazani eksport</button></div></div></div>`}
function renderFieldbook(){let l=lot(),ls=stages.filter(s=>s.lotId===l.id);document.getElementById("fieldbook").innerHTML=`<div class="grid g2"><div class="card"><h2 class="title">Dala daftari: ${l.id}</h2><p class="sub">Fenologik bosqichlar bo‘yicha yozuvlar</p><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Sana</th><th>Bosqich</th><th>Balandlik</th><th>Ko‘sak</th><th>Tozalik</th><th>Sog‘lomlik</th></tr></thead><tbody>${ls.map(s=>`<tr><td>${s.date||""}</td><td><b>${s.stage}</b></td><td>${s.height} sm</td><td>${s.boll}</td><td>${s.purity}%</td><td>${s.health}%</td></tr>`).join("")||`<tr><td colspan="6">Yozuv yo‘q</td></tr>`}</tbody></table></div></div><div class="card"><h2 class="title">Yangi kuzatuv qo‘shish</h2><div class="formgrid" style="margin-top:12px"><input id="sDate" type="date"><select id="sStage"><option>Unib chiqish</option><option>Chin barg</option><option>Shonalash</option><option>Gullash</option><option>Ko‘sak</option><option>Pishish</option></select><input id="sHeight" type="number" placeholder="Balandlik sm"><input id="sBoll" type="number" placeholder="Ko‘sak soni"><input id="sPurity" type="number" placeholder="Nav tozaligi %"><input id="sHealth" type="number" placeholder="Sog‘lomlik %"></div><button class="btn" style="margin-top:10px" onclick="addStage()">Saqlash</button></div></div>`}
function addStage(){let s={lotId:activeLotId,date:val("sDate"),stage:val("sStage"),height:+val("sHeight"),boll:+val("sBoll"),purity:+val("sPurity"),health:+val("sHealth")};stages.push(s);save();toast("Dala daftari saqlandi");renderAll()}
function renderSoil(){let l=lot(),c=layers[activeLayer];document.getElementById("soil").innerHTML=`<div class="grid g3"><div class="card"><div class="toolbar"><div><h2 class="title">Tuproq monitoringi</h2><p class="sub">Lokatsiya bo‘yicha N, P, K, namlik va sho‘rlanish</p></div><select onchange="activeLayer=this.value;renderSoil()">${Object.entries(layers).map(([k,v])=>`<option value="${k}" ${k===activeLayer?"selected":""}>${v[0]}</option>`).join("")}</select></div><div class="cards">${lots.map(x=>{let v=x[activeLayer],w=c[2]?clamp(v/c[2]*100):0;return `<button class="mini ${x.id===activeLotId?"active":""}" onclick="activeLotId='${x.id}';renderAll()"><div>📍</div><h3>${x.field}</h3><p>${c[0]}: ${v} ${c[1]}</p>${prog(w)}</button>`}).join("")}</div></div><div class="card"><h2 class="title">Tuproq tahlili</h2>${[["Namlik",l.moisture+"%"],["Azot",l.n+" mg/kg"],["Fosfor",l.p+" mg/kg"],["Kaliy",l.k+" mg/kg"],["pH",l.ph],["Sho‘rlanish",l.salinity+" dS/m"]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}<div class="note"><small>Tavsiya</small><b>Past elementlar bo‘yicha differensial oziqlantirish va qayta monitoring tavsiya etiladi.</b></div></div></div>`}
function renderQR(){let l=lot();document.getElementById("qr").innerHTML=`<div class="grid g2"><div class="card"><h2 class="title">QR scanner</h2><p class="sub">QR ichida partiya ID bo‘lsa, masalan: CS-001, nav kartasi ochiladi.</p><div class="scanner" style="margin-top:12px"><video id="video" playsinline></video><div class="actions" style="margin-top:10px"><button class="btn" onclick="startScanner()">Kamerani yoqish</button><button class="btn secondary" onclick="stopScanner()">To‘xtatish</button></div><p class="sub" id="scanStatus">Kamera ruxsati kerak bo‘lishi mumkin.</p></div><div style="margin-top:12px"><input id="manualQr" placeholder="QR/ID qo‘lda kiriting: CS-001"><button class="btn" style="margin-top:8px" onclick="openQrId()">Ochish</button></div></div><div class="card"><h2 class="title">Tanlangan partiya uchun QR matn</h2><p class="sub">Hozircha QR generator o‘rniga ID matni. Real bosqichda shu ID QR kodga aylantiriladi.</p><div class="qrbox" style="margin-top:12px">${l.id}</div>${lotCard(l)}</div></div>`}
async function startScanner(){let st=document.getElementById("scanStatus");if(!navigator.mediaDevices||!window.BarcodeDetector){st.textContent="Bu brauzerda avtomatik QR scanner ishlamadi. ID ni qo‘lda kiriting.";return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});let v=document.getElementById("video");v.srcObject=stream;await v.play();let detector=new BarcodeDetector({formats:["qr_code"]});scanTimer=setInterval(async()=>{try{let codes=await detector.detect(v);if(codes.length){let raw=codes[0].rawValue.trim();document.getElementById("manualQr").value=raw;openQrId();stopScanner()}}catch(e){}},700);st.textContent="Scanner ishlayapti. QR kodni kameraga tuting."}catch(e){st.textContent="Kamera ochilmadi. Brauzer ruxsatini tekshiring yoki ID ni qo‘lda kiriting."}}
function stopScanner(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function openQrId(){let id=val("manualQr").trim();let found=lots.find(l=>l.id.toLowerCase()===id.toLowerCase());if(found){activeLotId=found.id;toast("Partiya ochildi: "+found.id);setTab("variety")}else toast("Bu ID bazada topilmadi")}
function renderCulling(){let l=lot(),r=risk(l),f=forecast(l),d=dec(l);document.getElementById("culling").innerHTML=`<div class="grid g2"><div class="card"><h2 class="title">Brak algoritmi</h2><p class="sub">Dala + laboratoriya + tuproq ma’lumotlari asosida</p><div class="kv" style="margin-top:16px"><span>Brak xavfi</span><b>${r}%</b></div>${prog(r,"red")}<div class="kv" style="margin-top:16px"><span>Urug‘chilikka yaroqlilik</span><b>${f}%</b></div>${prog(f)}<div class="note"><small>Yakuniy qaror</small><div style="margin-top:7px">${badge(d)}</div><b>${d.note}</b></div></div><div class="card"><h2 class="title">Mezonlar</h2><div style="margin-top:12px">${["Unuvchanlik 85% dan past bo‘lsa xavf oshadi.","Nav tozaligi 95% dan past bo‘lsa brak mezoni kuchayadi.","Navga xos bo‘lmagan o‘simliklar ko‘payishi sifatni pasaytiradi.","Kasallik va zararkunanda belgisi qayta nazorat talab qiladi.","N, P, K va namlik yetishmovchiligi prognozga ta’sir qiladi."].map(x=>`<div class="mini" style="margin-bottom:8px">${x}</div>`).join("")}</div></div></div>`}
function renderForecast(){let l=lot(),items=[["Unuvchanlik",l.germination],["Nav tozaligi",l.purity],["Azot",clamp(l.n/80*100)],["Fosfor",clamp(l.p/50*100)],["Kaliy",clamp(l.k/90*100)],["Morfologiya",morph(l)]];document.getElementById("forecast").innerHTML=`<div class="grid g2"><div class="card"><h2 class="title">Nav prognozi: ${l.variety}</h2><div style="margin-top:12px">${items.map(x=>`<div class="kv"><span>${x[0]}</span><b>${Math.round(x[1])}%</b></div>${prog(x[1])}`).join("")}</div></div><div class="card"><h2 class="title">Partiyalar taqqoslash</h2><div style="margin-top:12px">${lots.map(x=>`<div class="kv"><span>${x.id} · ${x.variety}</span><b>${forecast(x)}%</b></div>${prog(forecast(x))}<div class="kv"><span>Brak xavfi</span><b>${risk(x)}%</b></div>${prog(risk(x),"red")}`).join("<hr style='border:0;border-top:1px solid #e2e8f0;margin:12px 0'>")}</div></div></div>`}
function renderReports(){document.getElementById("reports").innerHTML=`<div class="card"><h2 class="title">Hisobot va ma’lumotlar</h2><p class="sub">Ma’lumotlar telefonda lokal saqlanadi. Eksport qilsangiz JSON fayl bo‘lib yuklanadi.</p><div class="cards" style="margin-top:12px">${[["📋","Dala daftari","Morfologik kuzatuvlar"],["🧪","Tuproq tahlili","N, P, K, pH, sho‘rlanish"],["🧠","AI prognoz","Brak va tavsiyalar"],["🍃","Nav kartasi","Navga oid ma’lumotlar"],["📈","Hosildorlik","Taqqoslash"],["📄","Eksport","JSON format"]].map(x=>`<div class="mini"><div style="font-size:23px">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join("")}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="exportData()">JSON eksport</button><button class="btn secondary" onclick="importBox()">Import oynasi</button><button class="btn red" onclick="resetData()">Demo bazani tiklash</button></div><div id="importArea"></div></div>`}
function exportData(){let data=JSON.stringify({lots,stages},null,2),blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cottonseed_digital_lab_backup.json";a.click();URL.revokeObjectURL(a.href)}
function importBox(){document.getElementById("importArea").innerHTML=`<div style="margin-top:12px"><textarea id="importText" placeholder="JSON backup matnini shu yerga qo‘ying"></textarea><button class="btn" style="margin-top:8px" onclick="importData()">Import qilish</button></div>`}
function importData(){try{let data=JSON.parse(val("importText"));if(Array.isArray(data.lots))lots=data.lots;if(Array.isArray(data.stages))stages=data.stages;activeLotId=lots[0]?.id||"";save();toast("Import qilindi");renderAll()}catch(e){toast("JSON xato")}}
function resetData(){if(confirm("Demo bazani tiklaysizmi?")){lots=defaultLots;stages=defaultStages;activeLotId=lots[0].id;save();renderAll();toast("Tiklandi")}}
function val(id){return document.getElementById(id)?.value||""}
function render(){if(activeTab==="dashboard")renderDashboard();if(activeTab==="variety")renderVariety();if(activeTab==="fieldbook")renderFieldbook();if(activeTab==="soil")renderSoil();if(activeTab==="qr")renderQR();if(activeTab==="culling")renderCulling();if(activeTab==="forecast")renderForecast();if(activeTab==="reports")renderReports()}
function renderAll(){renderTabs();renderMetrics();render()}renderAll();
</script>
</body>
</html>
